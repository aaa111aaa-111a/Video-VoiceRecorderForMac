name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build-app.sh derives the build number from the commit count

      - name: Build app bundle
        run: ./Scripts/build-app.sh --configuration release

      - name: Zip
        run: ditto -c -k --keepParent dist/OptiRecord.app dist/OptiRecord.zip

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OptiRecord.zip
          body: |
            OptiRecord — Apple Silicon Mac 用の会議レコーダー。

            この zip は **ad-hoc 署名**です（Apple による notarize なし）。
            初回起動時は Finder で右クリック > 開く、から起動してください。
            起動後、システム設定 > プライバシーとセキュリティ > 画面収録 で許可が必要です。
