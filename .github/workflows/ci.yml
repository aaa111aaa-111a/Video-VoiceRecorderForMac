name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          uname -m

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v

  package-app:
    name: Package OptiRecord.app
    runs-on: macos-15
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        run: ./Scripts/build-app.sh --configuration release

      - name: Verify bundle layout
        run: |
          test -x dist/OptiRecord.app/Contents/MacOS/OptiRecord
          test -f dist/OptiRecord.app/Contents/Info.plist
          codesign --verify --verbose dist/OptiRecord.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptiRecord-app
          path: dist/OptiRecord.app
          if-no-files-found: error
